name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start transactional MongoDB
        run: |
          docker run --detach --name mongodb --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'; do sleep 1; done
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          until docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Strict typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017

      - name: Build frontend
        run: pnpm build:frontend
        env:
          MONGODB_URI: server-secret-must-not-ship
          VITE_API_BASE_URL: /api

      - name: Verify server configuration is absent from frontend output
        run: pnpm verify:frontend-env

      - name: Build same-origin frontend container
        run: docker build --tag booknowtech-frontend-security-test --file Dockerfile.frontend --build-arg VITE_API_BASE_URL=/api .

      - name: Verify frontend security headers
        run: pnpm test:security-headers

      - name: Build API
        run: pnpm build:api

      - name: Build worker
        run: pnpm build:worker

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
