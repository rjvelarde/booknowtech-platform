[build]
builder = "RAILPACK"
buildCommand = "corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm build:frontend"

[deploy]
startCommand = "pnpm --filter @booknowtech/frontend start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
